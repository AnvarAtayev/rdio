name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        # Pinned to a commit: this job handles the Sparkle signing key, the tap
        # token and the deploy key, so a mutable tag is more leverage than it's
        # worth handing to someone else's repo.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Build & package (universal)
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make app VERSION="$VERSION"
          zip="Rdio-${VERSION}.zip"
          ditto -c -k --keepParent Rdio.app "$zip"
          sha=$(shasum -a 256 "$zip" | awk '{print $1}')
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Artifact"
            echo ""
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$zip\` | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign update and build appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.package.outputs.zip }}"
          # sign_update ships inside the Sparkle SwiftPM artifact fetched by the build.
          SIGN="$(find .build/artifacts -name sign_update -path '*Sparkle*' | head -1)"
          if [ ! -x "$SIGN" ]; then echo "::error::sign_update not found under .build/artifacts"; exit 1; fi
          # Write the key to a file with no trailing newline (`-s` is deprecated;
          # `echo` would append a byte that sign_update rejects). Never printed.
          KEYF="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n' > "$KEYF"
          # Byte count only (44 for a valid key) — reveals no key material.
          echo "key length: $(wc -c < "$KEYF" | tr -d ' ') bytes (expect 44)"
          # Suppress the tool's stderr so a key it was handed can never reach the log.
          if ! SIG="$("$SIGN" --ed-key-file "$KEYF" -p "$ZIP" 2>/dev/null)"; then
            rm -f "$KEYF"
            echo "::error::sign_update failed — verify SPARKLE_PRIVATE_KEY holds the private key from 'generate_keys -x' (expected 44 bytes above)"
            exit 1
          fi
          rm -f "$KEYF"
          echo "signature length: ${#SIG} chars"
          LEN="$(stat -f%z "$ZIP")"
          REPO="$GITHUB_REPOSITORY" TAG="$GITHUB_REF_NAME" \
          VERSION="${{ steps.package.outputs.version }}" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}" \
          SIG="$SIG" LEN="$LEN" \
            bash packaging/make-appcast.sh > appcast.xml

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          body: |
            ### Download

            **Universal (Apple Silicon + Intel):** `${{ steps.package.outputs.zip }}`
            SHA-256: `${{ steps.package.outputs.sha }}`

      - name: Update Homebrew cask
        env:
          # GITHUB_TOKEN is scoped to this repo only, so pushing to the tap needs
          # a fine-grained PAT with Contents: read/write on homebrew-tap. It has
          # an expiry date; when it lapses this step fails loudly rather than
          # letting the cask drift behind the release again.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          TAP="$RUNNER_TEMP/tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$TAP"
          CASK="$TAP/Casks/rdio.rb"
          sed -i '' -E "s|^( *version )\".*\"|\1\"${VERSION}\"|; s|^( *sha256 )\".*\"|\1\"${SHA}\"|" "$CASK"
          if ! grep -q "version \"${VERSION}\"" "$CASK" || ! grep -q "sha256 \"${SHA}\"" "$CASK"; then
            echo "::error::cask rewrite did not apply — check the version/sha256 lines in Casks/rdio.rb"
            exit 1
          fi
          git -C "$TAP" config user.name "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$TAP" diff --quiet; then
            echo "cask unchanged"
          else
            git -C "$TAP" commit -am "rdio ${VERSION}"
            git -C "$TAP" push
          fi

      - name: Publish appcast to main
        env:
          # main requires pull requests, and the checkout's GITHUB_TOKEN can't
          # push through that. A deploy key is the only bypass actor narrow
          # enough to exempt this step without also exempting every human with
          # write access — GitHub Actions itself can only be a bypass actor on
          # org-owned repos.
          APPCAST_DEPLOY_KEY: ${{ secrets.APPCAST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/appcast_key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$APPCAST_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch main
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "Update appcast for ${GITHUB_REF_NAME}"
            git push origin main
          fi
